# These are conservative initial values, not certified safety parameters.
# Verify controller limits, workspace clearance and current joint feedback
# before sending any action goal.

rokae_moveabsj_action_server:
  ros__parameters:
    left_arm:
      robot_ip: "192.168.0.160"
      local_ip: "192.168.0.10"
      speed_mm_s: 50.0
      joint_speed_scale: 0.05
      zone_mm: 0.0
      timeout_s: 60.0
      soft_limit_margin_rad: 0.08
      max_goal_delta_rad: 2.0
      max_joint_speed_rad_s: 0.40
      goal_tolerance_rad: 0.01

    right_arm:
      robot_ip: "192.168.2.160"
      local_ip: "192.168.2.10"
      speed_mm_s: 50.0
      joint_speed_scale: 0.05
      zone_mm: 0.0
      timeout_s: 60.0
      soft_limit_margin_rad: 0.08
      max_goal_delta_rad: 2.0
      max_joint_speed_rad_s: 0.40
      goal_tolerance_rad: 0.01

